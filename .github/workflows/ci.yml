name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew build --no-daemon

      - name: Build distributable
        if: github.event_name == 'push'
        run: ./gradlew :spawnersilk-core:shadowJar --no-daemon

      - name: Select versioned artifact
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(./gradlew -q printVersion)
          echo "PLUGIN_JAR=spawnersilk-core/build/libs/spawner-silk-${version}.jar" >> "$GITHUB_ENV"

      - name: Upload distributable
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: spawnersilk-distribution
          path: ${{ env.PLUGIN_JAR }}
          if-no-files-found: error
          retention-days: 30
